client_id = "f7dfecdb8cb05f8874cd0db742121578"
name = "MoovExpress"
application_url = "https://moovexpress.com/api/integrazioni/shopify/enter"
embedded = false

[access_scopes]
scopes = "read_orders,read_assigned_fulfillment_orders,read_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,write_assigned_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_third_party_fulfillment_orders"
optional_scopes = [ ]
# use_legacy_install_flow = FALSE (Shopify Managed Installation). Verificato che va bene anche per
# questa app NON-embedded: all'apertura, /enter non trova il token, avvia il nostro OAuth classico
# (/install -> /admin/oauth/authorize -> /callback) e ottiene il token con l'authorization code grant
# — e' cosi' che sono stati provisionati i clienti Shopify (il callback prende il token). NON mettere
# true: la legacy flow NON supporta i webhook app-specific dichiarati qui sotto (deploy rifiutato), e
# il "la pagina non funziona" della review era un HTTP 431 (header/cookie troppo grandi sul collegamento
# dal portale), non un problema di install flow.
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://moovexpress.com/api/integrazioni/shopify/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://moovexpress.com/api/integrazioni/shopify/webhooks/compliance"

# Disinstallazione: alla rimozione dell'app segniamo l'integrazione come disconnessa e svuotiamo le
# credenziali (l'handler usa il service_role, il webhook arriva senza sessione). Prima NON era
# sottoscritto: la pulizia arrivava solo 48h dopo con shop/redact.
[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "https://moovexpress.com/api/integrazioni/shopify/webhooks/app-uninstalled"
