client_id = "f7dfecdb8cb05f8874cd0db742121578"
name = "MoovExpress"
application_url = "https://moovexpress.com/api/integrazioni/shopify/enter"
embedded = false

[access_scopes]
scopes = "read_orders,read_assigned_fulfillment_orders,read_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,write_assigned_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_third_party_fulfillment_orders"
optional_scopes = [ ]
# App NON-embedded (embedded=false): l'installazione la gestiamo noi via OAuth classico
# (/enter -> /install -> /admin/oauth/authorize -> /callback), che è l'unico modo di ottenere il
# token per un'app non-embedded. Con la Managed Installation (false) Shopify scavalcava il nostro
# OAuth e il negozio non si collegava: era il "la pagina non funziona" visto dalla review Shopify.
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://moovexpress.com/api/integrazioni/shopify/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://moovexpress.com/api/integrazioni/shopify/webhooks/compliance"
